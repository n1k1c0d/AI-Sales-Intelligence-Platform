name: dealmind

services:
  api:
    image: dealmind-api:0.1.0
    build: ./apps/api
    pull_policy: never
    environment:
      APP_ENV: "${APP_ENV-local}"
      APP_LOG_LEVEL: "${APP_LOG_LEVEL-INFO}"
      APP_CORS_ORIGINS: "${APP_CORS_ORIGINS-[]}"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    networks: [dealmind-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; import sys; sys.exit(urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status != 200)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    image: pgvector/pgvector:0.8.7-pg17-trixie@sha256:89947206f52eac3a9df9b663df7e76987cbdc623be6576b3a524953d568700d7
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dealmind}
      POSTGRES_USER: ${POSTGRES_USER:-dealmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [dealmind-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  n8n:
    image: n8nio/n8n:2.48.8@sha256:e0df076a41076127d5f765e05acb8ba746bddff86442a92269c0f5a7219a7e4b
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: "127.0.0.1"
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: "http://127.0.0.1:${N8N_HOST_PORT:-5678}"
      WEBHOOK_URL: "http://127.0.0.1:${N8N_HOST_PORT:-5678}/"
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [dealmind-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  dealmind-network:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
